[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-scanner"
version = "0.1.0"
description = "Static analysis foundation for malicious MCP server detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Malicious MCP Scanner Detection contributors" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-scanner = "mcp_scanner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src", "mcp_scanner.rules" = "rules"}
packages = ["mcp_scanner", "mcp_scanner.python_ast", "mcp_scanner.rules"]

[tool.setuptools.package-data]
"mcp_scanner.rules" = ["*.yaml", "*.yml"]
