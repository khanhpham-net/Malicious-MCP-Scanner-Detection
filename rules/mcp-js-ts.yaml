  - id: mcp-js-sensitive-fs-capability
    languages: [javascript, typescript]
    severity: INFO
    message: "Informational capability: JS/TS code reads a path matching common credential or dotfile locations (no outbound network sink confirmed by this rule alone)."
    metadata:
      category: other
      kind: capability_info
      mcp_surface: A5
      behavior_class: sensitive_fs_read_capability
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $STR
          - metavariable-regex:
              metavariable: $STR
              regex: '(?i)^[''"`](?:.*[/\\])?(?:\.ssh(?:[/\\].*)?|\.aws(?:[/\\].*)?|\.npmrc|\.gnupg(?:[/\\].*)?|\.netrc|\.kube[/\\]config|\.docker[/\\]config\.json|\.env(?:\.[A-Za-z0-9_.-]+)?|.*(?:id_rsa|id_ed25519|credentials).*)[''"`]$'
      - patterns:
          - pattern-regex: '(?i)`[^`\r\n]*(?:\.ssh|\.aws|\.npmrc|\.gnupg|\.netrc|\.kube[/\\]config|\.docker[/\\]config\.json|[/\\]\.env(?:\.[A-Za-z0-9_.-]+)?(?=[/\\`]|$)|id_rsa|id_ed25519|credentials)[^`\r\n]*`'
      - patterns:
          - pattern-either:
              - pattern: $PATH_MOD.join(..., $SEG, ...)
              - pattern: $PATH_MOD.resolve(..., $SEG, ...)
          - metavariable-regex:
              metavariable: $SEG
              regex: '(?i)^[''"`](?:.*[/\\])?(?:\.ssh(?:[/\\].*)?|\.aws(?:[/\\].*)?|\.npmrc|\.gnupg(?:[/\\].*)?|\.netrc|\.kube[/\\]config|\.docker[/\\]config\.json|\.env(?:\.[A-Za-z0-9_.-]+)?|.*(?:id_rsa|id_ed25519|credentials).*)[''"`]$'
    pattern-sinks:
      - pattern-either:
          - pattern: $FS.readFileSync($P, ...)
          - pattern: $FS.readFile($P, ...)
          - pattern: $FS.promises.readFile($P, ...)
          - pattern: readFileSync($P, ...)
          - pattern: readFile($P, ...)
