  - id: mcp-js-obfuscated-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: "Decoded or obfuscated data (base64/hex/atob) flows into dynamic JS/TS code or command execution."
    metadata:
      category: dynamic_code_execution
      kind: malicious_behavior
      mcp_surface: A5
      behavior_class: obfuscated_code_execution
      cwe:
        - CWE-506
        - CWE-94
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: Buffer.from($DATA, "base64", ...)
          - pattern: Buffer.from($DATA, "hex", ...)
          - pattern: atob($DATA)
    pattern-sinks:
      - pattern-either:
          - pattern: eval($SINK)
          - pattern: new Function(..., $SINK)
          - pattern: Function(..., $SINK)
          - pattern: $VM.runInNewContext($SINK, ...)
          - pattern: $VM.runInThisContext($SINK, ...)
          - pattern: new $VM.Script($SINK, ...)
          - patterns:
              - pattern-either:
                  - pattern: $CP.exec($SINK, ...)
                  - pattern: $CP.execSync($SINK, ...)
              - pattern-either:
                  - pattern-inside: |
                      import $CP from "child_process"
                      ...
                  - pattern-inside: |
                      import * as $CP from "child_process"
                      ...
                  - pattern-inside: |
                      import $CP from "node:child_process"
                      ...
                  - pattern-inside: |
                      import * as $CP from "node:child_process"
                      ...
                  - pattern-inside: |
                      const $CP = require("child_process")
                      ...
                  - pattern-inside: |
                      let $CP = require("child_process")
                      ...
                  - pattern-inside: |
                      var $CP = require("child_process")
                      ...
                  - pattern-inside: |
                      const $CP = require("node:child_process")
                      ...
                  - pattern-inside: |
                      let $CP = require("node:child_process")
                      ...
                  - pattern-inside: |
                      var $CP = require("node:child_process")
                      ...
          - patterns:
              - pattern: exec($SINK, ...)
              - pattern-either:
                  - pattern-inside: |
                      import { ..., exec, ... } from "child_process"
                      ...
                  - pattern-inside: |
                      import { ..., exec, ... } from "node:child_process"
                      ...
                  - pattern-inside: |
                      const { ..., exec, ... } = require("child_process")
                      ...
                  - pattern-inside: |
                      const { ..., exec, ... } = require("node:child_process")
                      ...
          - patterns:
              - pattern: execSync($SINK, ...)
              - pattern-either:
                  - pattern-inside: |
                      import { ..., execSync, ... } from "child_process"
                      ...
                  - pattern-inside: |
                      import { ..., execSync, ... } from "node:child_process"
                      ...
                  - pattern-inside: |
                      const { ..., execSync, ... } = require("child_process")
                      ...
                  - pattern-inside: |
                      const { ..., execSync, ... } = require("node:child_process")
                      ...
          - patterns:
              - pattern: $EXEC_ASYNC($SINK, ...)
              - pattern-either:
                  - pattern-inside: |
                      const $EXEC_ASYNC = $UTIL.promisify(exec)
                      ...
                  - pattern-inside: |
                      let $EXEC_ASYNC = $UTIL.promisify(exec)
                      ...
                  - pattern-inside: |
                      var $EXEC_ASYNC = $UTIL.promisify(exec)
                      ...
                  - pattern-inside: |
                      const $EXEC_ASYNC = promisify(exec)
                      ...
                  - pattern-inside: |
                      let $EXEC_ASYNC = promisify(exec)
                      ...
                  - pattern-inside: |
                      var $EXEC_ASYNC = promisify(exec)
                      ...
              - pattern-either:
                  - pattern-inside: |
                      import { ..., exec, ... } from "child_process"
                      ...
                  - pattern-inside: |
                      import { ..., exec, ... } from "node:child_process"
                      ...
                  - pattern-inside: |
                      const { ..., exec, ... } = require("child_process")
