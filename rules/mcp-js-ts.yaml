                  ...
              - pattern-inside: |
                  var { ..., exec, ... } = require("node:child_process")
                  ...
      - patterns:
          - pattern: $EXEC_ASYNC($CMD, ...)
          - pattern-not: $EXEC_ASYNC("...", ...)
          - pattern-either:
              - pattern-inside: |
                  const $EXEC_ASYNC = $UTIL.promisify($CP.exec)
                  ...
              - pattern-inside: |
                  let $EXEC_ASYNC = $UTIL.promisify($CP.exec)
                  ...
              - pattern-inside: |
                  var $EXEC_ASYNC = $UTIL.promisify($CP.exec)
                  ...
              - pattern-inside: |
                  const $EXEC_ASYNC = promisify($CP.exec)
                  ...
              - pattern-inside: |
                  let $EXEC_ASYNC = promisify($CP.exec)
                  ...
              - pattern-inside: |
                  var $EXEC_ASYNC = promisify($CP.exec)
                  ...
          - pattern-either:
              - pattern-inside: |
                  import $CP from "child_process"
                  ...
              - pattern-inside: |
                  import * as $CP from "child_process"
                  ...
              - pattern-inside: |
                  import $CP from "node:child_process"
                  ...
              - pattern-inside: |
                  import * as $CP from "node:child_process"
                  ...
              - pattern-inside: |
                  const $CP = require("child_process")
                  ...
              - pattern-inside: |
                  let $CP = require("child_process")
                  ...
              - pattern-inside: |
                  var $CP = require("child_process")
                  ...
              - pattern-inside: |
                  const $CP = require("node:child_process")
                  ...
              - pattern-inside: |
                  let $CP = require("node:child_process")
