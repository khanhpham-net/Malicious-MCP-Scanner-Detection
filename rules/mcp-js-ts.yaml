      - patterns:
          - pattern-either:
              - pattern: $UTIL.promisify($CP.exec)($CMD, ...)
              - pattern: promisify($CP.exec)($CMD, ...)
          - pattern-not: $UTIL.promisify($CP.exec)("...", ...)
          - pattern-not: promisify($CP.exec)("...", ...)
          - pattern-either:
              - pattern-inside: |
                  import $CP from "child_process"
                  ...
              - pattern-inside: |
