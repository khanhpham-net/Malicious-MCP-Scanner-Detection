rules:
  - id: mcp-js-child-process-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: "Dynamic command reaches Node.js child_process shell execution. Use execFile/spawn with a fixed executable and validated argv list without shell: true."
    metadata:
      category: C
      kind: vulnerability
      mcp_surface: A5
      behavior_class: command_injection
      cwe:
        - CWE-78
    pattern-either:
      # 1. Default / namespace import or require: bind exact $CP receiver so RegExp.exec() never matches
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
          - pattern-not: $CP.exec("...", ...)
          - pattern-not: $CP.execSync("...", ...)
          - pattern-either:
              - pattern-inside: |
                  import $CP from "child_process"
                  ...
              - pattern-inside: |
                  import * as $CP from "child_process"
                  ...
              - pattern-inside: |
                  import $CP from "node:child_process"
                  ...
              - pattern-inside: |
                  import * as $CP from "node:child_process"
                  ...
              - pattern-inside: |
                  const $CP = require("child_process")
                  ...
              - pattern-inside: |
                  let $CP = require("child_process")
                  ...
              - pattern-inside: |
                  var $CP = require("child_process")
                  ...
              - pattern-inside: |
                  const $CP = require("node:child_process")
                  ...
              - pattern-inside: |
                  let $CP = require("node:child_process")
                  ...
              - pattern-inside: |
                  var $CP = require("node:child_process")
                  ...
      # 2. Direct chained require("child_process").exec(...) / .execSync(...)
      - patterns:
          - pattern-either:
              - pattern: require("child_process").exec($CMD, ...)
              - pattern: require("child_process").execSync($CMD, ...)
              - pattern: require("node:child_process").exec($CMD, ...)
              - pattern: require("node:child_process").execSync($CMD, ...)
          - pattern-not: require("child_process").exec("...", ...)
          - pattern-not: require("child_process").execSync("...", ...)
          - pattern-not: require("node:child_process").exec("...", ...)
          - pattern-not: require("node:child_process").execSync("...", ...)
      # 3. Named import/destructure of bare exec / execSync (bound strictly to bare function name)
      - patterns:
          - pattern: exec($CMD, ...)
          - pattern-not: exec("...", ...)
          - pattern-either:
              - pattern-inside: |
                  import { ..., exec, ... } from "child_process"
                  ...
              - pattern-inside: |
                  import { ..., exec, ... } from "node:child_process"
                  ...
              - pattern-inside: |
                  const { ..., exec, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  let { ..., exec, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  var { ..., exec, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  const { ..., exec, ... } = require("node:child_process")
                  ...
              - pattern-inside: |
                  let { ..., exec, ... } = require("node:child_process")
                  ...
              - pattern-inside: |
                  var { ..., exec, ... } = require("node:child_process")
                  ...
      - patterns:
          - pattern: execSync($CMD, ...)
          - pattern-not: execSync("...", ...)
          - pattern-either:
              - pattern-inside: |
                  import { ..., execSync, ... } from "child_process"
                  ...
              - pattern-inside: |
                  import { ..., execSync, ... } from "node:child_process"
                  ...
              - pattern-inside: |
                  const { ..., execSync, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  let { ..., execSync, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  var { ..., execSync, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  const { ..., execSync, ... } = require("node:child_process")
                  ...
              - pattern-inside: |
                  let { ..., execSync, ... } = require("node:child_process")
                  ...
              - pattern-inside: |
                  var { ..., execSync, ... } = require("node:child_process")
                  ...
      # 4. spawn / spawnSync / execFile / execFileSync with shell: true (never match without shell: true)
      - patterns:
          - pattern-either:
              - pattern: '$CP.spawn($CMD, $ARGS, { ..., shell: true, ... }, ...)'
              - pattern: '$CP.spawn($CMD, { ..., shell: true, ... }, ...)'
              - pattern: '$CP.spawnSync($CMD, $ARGS, { ..., shell: true, ... }, ...)'
              - pattern: '$CP.spawnSync($CMD, { ..., shell: true, ... }, ...)'
              - pattern: '$CP.execFile($CMD, $ARGS, { ..., shell: true, ... }, ...)'
              - pattern: '$CP.execFile($CMD, { ..., shell: true, ... }, ...)'
              - pattern: '$CP.execFileSync($CMD, $ARGS, { ..., shell: true, ... }, ...)'
              - pattern: '$CP.execFileSync($CMD, { ..., shell: true, ... }, ...)'
          - pattern-either:
              - pattern-inside: |
                  import $CP from "child_process"
                  ...
              - pattern-inside: |
                  import * as $CP from "child_process"
                  ...
              - pattern-inside: |
                  import $CP from "node:child_process"
                  ...
              - pattern-inside: |
                  import * as $CP from "node:child_process"
                  ...
              - pattern-inside: |
                  const $CP = require("child_process")
                  ...
              - pattern-inside: |
                  let $CP = require("child_process")
                  ...
              - pattern-inside: |
                  var $CP = require("child_process")
                  ...
              - pattern-inside: |
                  const $CP = require("node:child_process")
                  ...
              - pattern-inside: |
                  let $CP = require("node:child_process")
                  ...
              - pattern-inside: |
                  var $CP = require("node:child_process")
                  ...
      - pattern-either:
          - pattern: 'require("child_process").spawn($CMD, $ARGS, { ..., shell: true, ... }, ...)'
          - pattern: 'require("child_process").spawn($CMD, { ..., shell: true, ... }, ...)'
          - pattern: 'require("child_process").spawnSync($CMD, $ARGS, { ..., shell: true, ... }, ...)'
          - pattern: 'require("child_process").spawnSync($CMD, { ..., shell: true, ... }, ...)'
          - pattern: 'require("node:child_process").spawn($CMD, $ARGS, { ..., shell: true, ... }, ...)'
          - pattern: 'require("node:child_process").spawn($CMD, { ..., shell: true, ... }, ...)'
          - pattern: 'require("node:child_process").spawnSync($CMD, $ARGS, { ..., shell: true, ... }, ...)'
          - pattern: 'require("node:child_process").spawnSync($CMD, { ..., shell: true, ... }, ...)'
          - pattern: 'require("child_process").execFile($CMD, $ARGS, { ..., shell: true, ... }, ...)'
          - pattern: 'require("child_process").execFile($CMD, { ..., shell: true, ... }, ...)'
          - pattern: 'require("child_process").execFileSync($CMD, $ARGS, { ..., shell: true, ... }, ...)'
          - pattern: 'require("child_process").execFileSync($CMD, { ..., shell: true, ... }, ...)'
          - pattern: 'require("node:child_process").execFile($CMD, $ARGS, { ..., shell: true, ... }, ...)'
          - pattern: 'require("node:child_process").execFile($CMD, { ..., shell: true, ... }, ...)'
          - pattern: 'require("node:child_process").execFileSync($CMD, $ARGS, { ..., shell: true, ... }, ...)'
          - pattern: 'require("node:child_process").execFileSync($CMD, { ..., shell: true, ... }, ...)'
      - patterns:
          - pattern-either:
              - pattern: 'spawn($CMD, $ARGS, { ..., shell: true, ... }, ...)'
              - pattern: 'spawn($CMD, { ..., shell: true, ... }, ...)'
          - pattern-either:
              - pattern-inside: |
                  import { ..., spawn, ... } from "child_process"
                  ...
              - pattern-inside: |
                  import { ..., spawn, ... } from "node:child_process"
                  ...
              - pattern-inside: |
                  const { ..., spawn, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  let { ..., spawn, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  var { ..., spawn, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  const { ..., spawn, ... } = require("node:child_process")
                  ...
              - pattern-inside: |
                  let { ..., spawn, ... } = require("node:child_process")
                  ...
              - pattern-inside: |
                  var { ..., spawn, ... } = require("node:child_process")
                  ...
      - patterns:
          - pattern-either:
              - pattern: 'spawnSync($CMD, $ARGS, { ..., shell: true, ... }, ...)'
              - pattern: 'spawnSync($CMD, { ..., shell: true, ... }, ...)'
          - pattern-either:
              - pattern-inside: |
                  import { ..., spawnSync, ... } from "child_process"
                  ...
              - pattern-inside: |
                  import { ..., spawnSync, ... } from "node:child_process"
                  ...
              - pattern-inside: |
                  const { ..., spawnSync, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  let { ..., spawnSync, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  var { ..., spawnSync, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  const { ..., spawnSync, ... } = require("node:child_process")
                  ...
              - pattern-inside: |
                  let { ..., spawnSync, ... } = require("node:child_process")
                  ...
              - pattern-inside: |
                  var { ..., spawnSync, ... } = require("node:child_process")
                  ...
      - patterns:
          - pattern-either:
              - pattern: 'execFile($CMD, $ARGS, { ..., shell: true, ... }, ...)'
              - pattern: 'execFile($CMD, { ..., shell: true, ... }, ...)'
          - pattern-either:
              - pattern-inside: |
                  import { ..., execFile, ... } from "child_process"
                  ...
              - pattern-inside: |
                  import { ..., execFile, ... } from "node:child_process"
                  ...
              - pattern-inside: |
                  const { ..., execFile, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  let { ..., execFile, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  var { ..., execFile, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  const { ..., execFile, ... } = require("node:child_process")
                  ...
              - pattern-inside: |
                  let { ..., execFile, ... } = require("node:child_process")
                  ...
              - pattern-inside: |
                  var { ..., execFile, ... } = require("node:child_process")
                  ...
      - patterns:
          - pattern-either:
              - pattern: 'execFileSync($CMD, $ARGS, { ..., shell: true, ... }, ...)'
              - pattern: 'execFileSync($CMD, { ..., shell: true, ... }, ...)'
          - pattern-either:
              - pattern-inside: |
                  import { ..., execFileSync, ... } from "child_process"
                  ...
              - pattern-inside: |
                  import { ..., execFileSync, ... } from "node:child_process"
                  ...
              - pattern-inside: |
                  const { ..., execFileSync, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  let { ..., execFileSync, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  var { ..., execFileSync, ... } = require("child_process")
                  ...
              - pattern-inside: |
                  const { ..., execFileSync, ... } = require("node:child_process")
                  ...
              - pattern-inside: |
                  let { ..., execFileSync, ... } = require("node:child_process")
                  ...
              - pattern-inside: |
                  var { ..., execFileSync, ... } = require("node:child_process")
                  ...
      # 5. util.promisify(exec) / promisify(exec) / promisify($CP.exec) (alias & inline)
      - patterns:
          - pattern: $EXEC_ASYNC($CMD, ...)
          - pattern-not: $EXEC_ASYNC("...", ...)
          - pattern-either:
              - pattern-inside: |
                  const $EXEC_ASYNC = $UTIL.promisify(exec)
                  ...
              - pattern-inside: |
                  let $EXEC_ASYNC = $UTIL.promisify(exec)
                  ...
              - pattern-inside: |
                  var $EXEC_ASYNC = $UTIL.promisify(exec)
                  ...
              - pattern-inside: |
                  const $EXEC_ASYNC = promisify(exec)
                  ...
              - pattern-inside: |
