  - id: mcp-js-env-to-network
    languages: [javascript, typescript]
    severity: WARNING
    message: "Sensitive environment variable data (process.env) flows into an outbound network call. Verify destination host, scope, and authorization policy."
    metadata:
      category: S
      kind: vulnerability
      mcp_surface: A5
      behavior_class: sensitive_env_to_network
      cwe:
        - CWE-200
    mode: taint
    pattern-sources:
      # 1. Whole process.env object reference (tracks aliases like `const env = process.env`, `process.env ?? {}`, `{ ...env }`)
      - label: ENV_OBJECT
        pattern: process.env
      # 2. Direct or aliased sensitive dot / optional-chain property access -> SENSITIVE_ENV
      - label: SENSITIVE_ENV
        requires: ENV_OBJECT and not NOT_ENV_OBJECT
        patterns:
          - pattern-either:
              - pattern: $ENV.$VAR
              - pattern: $ENV?.$VAR
          - metavariable-regex:
              metavariable: $VAR
              regex: '(?i)^(?!(?:.*[_-])?(?:PUBLIC|CACHE|PRIMARY|SORT|PARTITION|FOREIGN|INDEX|LOCALE|I18N)[_-]?KEY$)(?:.*(?:TOKEN|SECRET|PASS(?:WORD|WD)?|CREDENTIAL|CRED(?:S)?|AUTH|COOKIE|BEARER|SIGNING|PRIVATE.?KEY|ACCESS.?KEY|API.?KEY|SESSION.?KEY|CLIENT.?KEY|MASTER.?KEY|ENCRYPTION.?KEY|STORAGE.?KEY|SERVICE.?KEY|APP.?KEY|SSH.?KEY|DOTENV.?KEY)|(?:.*_)?(?:PAT|DSN|KEY)(?:_.*)?|.+_PWD)$'
      # 3. Sensitive bracket access with a literal or constant key -> SENSITIVE_ENV
      - label: SENSITIVE_ENV
        requires: ENV_OBJECT and not NOT_ENV_OBJECT
        patterns:
          - pattern-either:
              - pattern: $ENV[$KEY]
              - pattern: $ENV?.[$KEY]
          - metavariable-comparison:
              metavariable: $KEY
              comparison: >-
                re.match("(?i)^(?!(?:.*[_-])?(?:PUBLIC|CACHE|PRIMARY|SORT|PARTITION|FOREIGN|INDEX|LOCALE|I18N)[_-]?KEY$)(?:.*(?:TOKEN|SECRET|PASS(?:WORD|WD)?|CREDENTIAL|CRED(?:S)?|AUTH|COOKIE|BEARER|SIGNING|PRIVATE.?KEY|ACCESS.?KEY|API.?KEY|SESSION.?KEY|CLIENT.?KEY|MASTER.?KEY|ENCRYPTION.?KEY|STORAGE.?KEY|SERVICE.?KEY|APP.?KEY|SSH.?KEY|DOTENV.?KEY)|(?:.*_)?(?:PAT|DSN|KEY)(?:_.*)?|.+_PWD)$", $KEY)
      # 4. Direct or aliased destructuring of sensitive field -> SENSITIVE_ENV
      - label: SENSITIVE_ENV
        requires: ENV_OBJECT and not NOT_ENV_OBJECT
        patterns:
          - pattern-either:
              - pattern: const { ..., $VAR, ... } = $ENV
              - pattern: let { ..., $VAR, ... } = $ENV
              - pattern: var { ..., $VAR, ... } = $ENV
          - metavariable-regex:
              metavariable: $VAR
              regex: '(?i)^(?!(?:.*[_-])?(?:PUBLIC|CACHE|PRIMARY|SORT|PARTITION|FOREIGN|INDEX|LOCALE|I18N)[_-]?KEY$)(?:.*(?:TOKEN|SECRET|PASS(?:WORD|WD)?|CREDENTIAL|CRED(?:S)?|AUTH|COOKIE|BEARER|SIGNING|PRIVATE.?KEY|ACCESS.?KEY|API.?KEY|SESSION.?KEY|CLIENT.?KEY|MASTER.?KEY|ENCRYPTION.?KEY|STORAGE.?KEY|SERVICE.?KEY|APP.?KEY|SSH.?KEY|DOTENV.?KEY)|(?:.*_)?(?:PAT|DSN|KEY)(?:_.*)?|.+_PWD)$'
          - focus-metavariable: $VAR
      # 5. Any single-field extraction from ENV_OBJECT ceases to be the whole ENV_OBJECT
      - label: NOT_ENV_OBJECT
        requires: ENV_OBJECT
        patterns:
          - pattern-either:
              - pattern: $ENV.$PROP
              - pattern: $ENV?.$PROP
              - pattern: $ENV[$PROP]
              - pattern: $ENV?.[$PROP]
          - pattern-not: process.env
          - pattern-not: $ENV.$PROP(...)
          - pattern-not: $ENV?.$PROP(...)
          - pattern-not: Object.values(...).$PROP
          - pattern-not: Object.entries(...).$PROP
          - pattern-not: JSON.stringify(...).$PROP
      - label: NOT_ENV_OBJECT
        requires: ENV_OBJECT
        patterns:
          - pattern-either:
              - pattern: const { ..., $PROP, ... } = $ENV
              - pattern: let { ..., $PROP, ... } = $ENV
              - pattern: var { ..., $PROP, ... } = $ENV
          - focus-metavariable: $PROP
    pattern-propagators:
      - from: $E
        to: $OUT
        label: SENSITIVE_ENV
        requires: ENV_OBJECT and not NOT_ENV_OBJECT
        pattern-either:
          - pattern: $OUT = JSON.stringify($E, ...)
